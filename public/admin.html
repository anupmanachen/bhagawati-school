<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagwati Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #1e3a8a; }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #1e3a8a; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #172554; }
        .hidden { display: none; }
        .notice-item { border-left: 4px solid #1e3a8a; padding: 10px; margin-bottom: 10px; background: #f8fafc; display: flex; justify-content: space-between; }
        .btn-delete { background: #dc2626; width: auto; padding: 6px 12px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section" class="card">
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username (default: admin)">
            <input type="password" id="password" placeholder="Password (default: Password@123)">
            <button onclick="login()">Log In</button>
            <p id="login-error" style="color: red;"></p>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden">
            <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Admin Control Panel</h2>
                <button onclick="logout()" style="width: auto; background: #64748b;">Logout</button>
            </div>

            <!-- POST NOTICE FORM -->
            <div class="card">
                <h3>Publish New Notice</h3>
                <input type="text" id="notice-title" placeholder="Notice Title">
                <select id="notice-category">
                    <option value="General">General</option>
                    <option value="Admission">Admission</option>
                    <option value="Exam">Exam / Results</option>
                    <option value="Holiday">Holiday</option>
                </select>
                <textarea id="notice-content" rows="4" placeholder="Notice content / details..."></textarea>
                <button onclick="publishNotice()">Publish Notice</button>
            </div>

            <!-- POST RESULT FORM -->
            <div class="card">
                <h3>Publish Student Result</h3>
                <input type="text" id="res-symbol" placeholder="Symbol Number (e.g. 0204589)">
                <input type="text" id="res-name" placeholder="Student Full Name">
                <input type="text" id="res-class" placeholder="Class / Grade (e.g. 10 or 11)">
                <input type="text" id="res-term" placeholder="Exam Term (e.g. SEE Pre-Board 2083)">
                <input type="text" id="res-gpa" placeholder="GPA / Grade (e.g. 3.65)">
                <input type="text" id="res-remarks" placeholder="Remarks (e.g. Passed with Distinction)">
                <button onclick="publishResult()">Save Result</button>
            </div>

            <!-- ACTIVE NOTICES LIST -->
            <div class="card">
                <h3>Live Notices</h3>
                <div id="notices-list">Loading notices...</div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000/api';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch(`${API}/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('adminToken', data.token);
                showDashboard();
            } else {
                document.getElementById('login-error').innerText = data.message;
            }
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            loadNotices();
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        async function publishNotice() {
            const token = localStorage.getItem('adminToken');
            const title = document.getElementById('notice-title').value;
            const category = document.getElementById('notice-category').value;
            const content = document.getElementById('notice-content').value;

            const res = await fetch(`${API}/admin/notices`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ title, category, content })
            });
            if (res.ok) {
                alert('Notice published!');
                document.getElementById('notice-title').value = '';
                document.getElementById('notice-content').value = '';
                loadNotices();
            }
        }

        async function publishResult() {
            const token = localStorage.getItem('adminToken');
            const payload = {
                symbol_no: document.getElementById('res-symbol').value,
                student_name: document.getElementById('res-name').value,
                class_grade: document.getElementById('res-class').value,
                exam_term: document.getElementById('res-term').value,
                gpa: document.getElementById('res-gpa').value,
                remarks: document.getElementById('res-remarks').value
            };

            const res = await fetch(`${API}/admin/results`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Result saved to database!');
            }
        }

        async function loadNotices() {
            const res = await fetch(`${API}/notices`);
            const notices = await res.json();
            const container = document.getElementById('notices-list');
            if (notices.length === 0) {
                container.innerHTML = '<p>No active notices found.</p>';
                return;
            }
            container.innerHTML = notices.map(n => `
                <div class="notice-item">
                    <div>
                        <strong>[${n.category}] ${n.title}</strong><br>
                        <small>${n.published_date}</small>
                        <p>${n.content}</p>
                    </div>
                    <button class="btn-delete" onclick="deleteNotice(${n.id})">Delete</button>
                </div>
            `).join('');
        }

        async function deleteNotice(id) {
            const token = localStorage.getItem('adminToken');
            if (!confirm('Are you sure you want to delete this notice?')) return;
            const res = await fetch(`${API}/admin/notices/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadNotices();
        }

        if (localStorage.getItem('adminToken')) {
            showDashboard();
        }
    </script>
</body>
</html>
